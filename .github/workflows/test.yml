name: test

on:
  push:
  pull_request:

# Least privilege: this workflow only reads the repository.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      # Pinned to full commit SHAs so a retagged or moved ref cannot change
      # what runs in CI. Dependabot can update these pins.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - name: Syntax check
        run: node --check lib/index.js && node --check lib/client.js && node --check scripts/install.mjs
      - name: Unit tests
        run: node --test
