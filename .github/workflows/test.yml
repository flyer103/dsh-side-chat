name: test

on:
  push:
  pull_request:

# Least privilege: this workflow only reads the repository.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      # Pinned to full commit SHAs (v4.4.0) so a retagged or moved ref cannot
      # change what runs in CI. Dependabot can update these pins.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
      - name: Syntax check
        run: node --check lib/index.js && node --check lib/client.js && node --check scripts/install.mjs
      - name: Unit tests
        run: node --test
